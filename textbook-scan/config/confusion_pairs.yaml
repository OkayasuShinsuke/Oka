# 仕様書 §11.1 の誤読パターン台帳。
# 各エントリは「混同されやすい文字/記号の組」。認識結果にこれらが含まれる場合、
# tscan.verify.combine_confidence の penalty 項を減点する材料として使う。

japanese:
  - {a: "ロ", b: "口", note: "カタカナのロと漢字の口"}
  - {a: "ロ", b: "0", note: "カタカナのロと数字のゼロ"}
  - {a: "一", b: "ー", note: "漢数字いちと長音符"}
  - {a: "一", b: "−", note: "漢数字いちとマイナス記号"}
  - {a: "カ", b: "力", note: "カタカナのカと漢字のちから(物理教科書で頻出)"}
  - {a: "ヘ", b: "へ", note: "カタカナとひらがなのヘ"}
  - {a: "ニ", b: "二", note: "カタカナのニと漢数字のに"}
  - {a: "工", b: "エ", note: "漢字のたくみと、カタカナのエ"}
  - {a: "巳", b: "已", note: "低頻度だが常に要確認"}
  - {a: "巳", b: "己", note: "低頻度だが常に要確認"}

math:
  - {a: "x", b: "×", note: "変数xとかける記号(§11.1で最重要視)"}
  - {a: "-", b: "−", note: "ハイフンとマイナス"}
  - {a: "-", b: "ー", note: "ハイフンと長音符"}
  - {a: "l", b: "1", note: "小文字エルと数字いち"}
  - {a: "l", b: "|", note: "小文字エルと縦棒"}
  - {a: "0", b: "O", note: "数字ゼロとアルファベットのオー"}
  - {a: "0", b: "θ", note: "数字ゼロとギリシャ文字シータ(物理で致命的)"}
  - {a: "α", b: "a", note: "ギリシャ文字アルファとアルファベットのa"}
  - {a: "ν", b: "v", note: "ギリシャ文字ニューとアルファベットのv"}
  - {a: "ρ", b: "p", note: "ギリシャ文字ローとアルファベットのp"}
  - {a: "κ", b: "k", note: "ギリシャ文字カッパとアルファベットのk"}
