<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advanced Lab — 電磁気学・東大数学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.9/contrib/auto-render.min.js"></script>
<style>
  /* ============================================================
     色・タイポグラフィの「トークン」
     ラボノート／基盤(PCB)風。ライト＝方眼紙のノート、ダーク＝実験室の基盤。
     ============================================================ */
  :root {
    --bg: #f3f1ea;
    --bg-grid: rgba(30,40,50,.06);
    --panel: #ffffff;
    --panel-2: #ecebe3;
    --ink: #1b2430;
    --ink-dim: #5b6472;
    --line: #d9d6c9;
    --accent: #1f6f5c;      /* 深緑：電磁気・正解 */
    --accent-2: #b5502f;    /* 銅色：数学・強調 */
    --accent-3: #2b5fa8;    /* 青：情報・XP */
    --ok: #1f8a4c;
    --ng: #c23b3b;
    --shadow: rgba(30,20,10,.14);
    --serif: "Zen Kaku Gothic New", "Hiragino Mincho ProN", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1210;
      --bg-grid: rgba(120,255,210,.05);
      --panel: #121a17;
      --panel-2: #182420;
      --ink: #e7f3ec;
      --ink-dim: #8fa89c;
      --line: #24352e;
      --accent: #4fd8ab;
      --accent-2: #ff9d66;
      --accent-3: #7ab6ff;
      --ok: #4fd8ab;
      --ng: #ff6b6b;
      --shadow: rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1210;
    --bg-grid: rgba(120,255,210,.05);
    --panel: #121a17;
    --panel-2: #182420;
    --ink: #e7f3ec;
    --ink-dim: #8fa89c;
    --line: #24352e;
    --accent: #4fd8ab;
    --accent-2: #ff9d66;
    --accent-3: #7ab6ff;
    --ok: #4fd8ab;
    --ng: #ff6b6b;
    --shadow: rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    transition: background-color .2s, color .2s;
  }
  .app { max-width: 640px; margin: 0 auto; min-height: 100%; padding: 12px 16px 28px; }
  button { font-family: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-3); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--sans); margin: 0; }
  p { margin: 0; }

  /* ===== ヘッダー：HUD（XP・ストリーク・テーマ切替） ===== */
  header.hud {
    display: flex; align-items: center; gap: 8px; padding: 8px 4px 14px;
    border-bottom: 1px solid var(--line); margin-bottom: 14px;
  }
  .brand { display: flex; align-items: baseline; gap: 6px; flex: 1; min-width: 0; }
  .brand .mark { color: var(--accent); font-family: var(--mono); font-weight: 700; }
  .brand h1 { font-size: 1.02rem; font-weight: 700; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: .82rem; color: var(--ink-dim); white-space: nowrap; }
  .stat b { color: var(--ink); font-weight: 700; font-size: .95rem; }
  .stat.xp b { color: var(--accent-3); }
  .stat.streak b { color: var(--accent-2); }
  .iconbtn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); flex: none; font-size: 1rem;
  }
  .iconbtn:active { transform: translateY(1px); }

  /* ===== 汎用パネル・カード ===== */
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; box-shadow: 0 1px 0 var(--shadow);
  }
  .lead { color: var(--ink-dim); font-size: .88rem; line-height: 1.6; margin: 6px 0 18px; }
  section#screens > section { display: flex; flex-direction: column; gap: 14px; }

  /* ===== 科目・単元選択 ===== */
  .subjectGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .subjectGrid { grid-template-columns: 1fr; } }
  .subjectCard {
    text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    padding: 18px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
  }
  .subjectCard::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--bar, var(--accent));
  }
  .subjectCard.em { --bar: var(--accent); }
  .subjectCard.math { --bar: var(--accent-2); }
  .subjectCard .tag { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; color: var(--ink-dim); text-transform: uppercase; }
  .subjectCard .ttl { font-size: 1.15rem; font-weight: 700; }
  .subjectCard .desc { font-size: .82rem; color: var(--ink-dim); line-height: 1.5; }
  .subjectCard:active { transform: translateY(1px); }

  .unitList { display: flex; flex-direction: column; gap: 10px; }
  .unitRow {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 14px 16px;
  }
  .unitRow:active { transform: translateY(1px); }
  .unitRow .idx { font-family: var(--mono); font-size: .78rem; color: var(--ink-dim); width: 1.6em; flex: none; }
  .unitRow .body { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .unitRow .name { font-weight: 700; font-size: .98rem; }
  .unitRow .meta { font-size: .74rem; color: var(--ink-dim); font-family: var(--mono); }
  .unitRow .stat-badge {
    font-family: var(--mono); font-size: .72rem; padding: 3px 8px; border-radius: 999px;
    background: var(--panel-2); color: var(--ink-dim); flex: none;
  }
  .unitRow .stat-badge.hasdata { color: var(--accent); border: 1px solid var(--line); }

  .backRow { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .backBtn {
    display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; background: var(--panel);
  }
  .backBtn:active { transform: translateY(1px); }
  .screenTitle { font-size: 1.2rem; font-weight: 700; }
  .breadcrumb { font-family: var(--mono); font-size: .74rem; color: var(--ink-dim); }

  /* ===== 出題画面 ===== */
  .qnoRow { display: flex; justify-content: space-between; align-items: baseline; }
  .qtag { font-family: var(--mono); font-size: .74rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }
  .qcounter { font-family: var(--mono); font-size: .78rem; color: var(--ink-dim); }
  .qbody { font-size: 1.05rem; line-height: 1.9; }
  .qbody .katex { font-size: 1.06em; }
  .given { margin-top: 4px; font-size: .92rem; color: var(--ink-dim); line-height: 1.7; }
  .given .katex { font-size: 1em; }

  .answerRow { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .answerRow input {
    flex: 1; min-width: 0; font-family: var(--mono); font-size: 1.1rem; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--ink);
  }
  .unitSuffix { font-family: var(--mono); font-size: .9rem; color: var(--ink-dim); }
  .primaryBtn {
    background: var(--accent); color: #fff; border-radius: 8px; padding: 12px 22px;
    font-weight: 700; font-size: .95rem; letter-spacing: .01em; white-space: nowrap;
  }
  .primaryBtn:active { transform: translateY(1px); }
  .primaryBtn.wide { width: 100%; }
  .primaryBtn:disabled { opacity: .4; cursor: default; }
  .ghostBtn {
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 18px; font-size: .9rem; color: var(--ink-dim);
  }
  .ghostBtn:active { transform: translateY(1px); }
  .hint { font-size: .78rem; color: var(--ink-dim); }

  /* ===== 解答画面 ===== */
  .verdict { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; font-weight: 700; }
  .verdict.correct { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .verdict.wrong { background: color-mix(in srgb, var(--ng) 14%, transparent); color: var(--ng); }
  .verdict .big { font-size: 1.3rem; }
  .answerLine { font-size: 1rem; }
  .answerLine .katex { font-size: 1.08em; }
  .steps { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .step .n {
    flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2);
    color: var(--ink-dim); font-family: var(--mono); font-size: .72rem; display: grid; place-items: center;
    margin-top: 2px; border: 1px solid var(--line);
  }
  .step .txt { flex: 1; font-size: .96rem; line-height: 1.75; }
  .step .txt .katex-display { margin: .35em 0; }
  .divider { border-top: 1px solid var(--line); margin: 6px 0; }

  /* ===== 図解（SVG）・根拠（なぜ成り立つか）・別解 ===== */
  .diagramBox { display: flex; justify-content: center; margin: 4px 0 2px; }
  .diagramBox svg { width: 100%; max-width: 300px; height: auto; display: block; }
  .whyBox {
    background: color-mix(in srgb, var(--accent-3) 10%, var(--panel));
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    font-size: .9rem; line-height: 1.75; color: var(--ink);
  }
  .whyBox .lbl, .altBox .lbl {
    display: block; font-family: var(--mono); font-size: .7rem; letter-spacing: .06em;
    text-transform: uppercase; margin-bottom: 5px;
  }
  .whyBox .lbl { color: var(--accent-3); }
  .altBox { margin-top: 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .altBox .lbl { color: var(--accent-2); }
  .term { border-bottom: 1px dotted var(--ink-dim); }
  .term .def { font-size: .86em; color: var(--ink-dim); }
  .selfGrade { display: flex; flex-direction: column; gap: 10px; }
  .selfGrade .prompt { font-size: .9rem; color: var(--ink-dim); }
  .selfGradeBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gradeBtn {
    border-radius: 10px; padding: 14px; font-weight: 700; font-size: .95rem; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .gradeBtn.good { background: color-mix(in srgb, var(--ok) 12%, var(--panel)); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .gradeBtn.bad { background: color-mix(in srgb, var(--ng) 12%, var(--panel)); color: var(--ng); border-color: color-mix(in srgb, var(--ng) 40%, var(--line)); }
  .gradeBtn:active { transform: translateY(1px); }
  .gradeBtn .e { font-size: 1.3rem; }
  .gradeBtn:disabled { opacity: .35; }
  .xpToast {
    font-family: var(--mono); font-size: .8rem; color: var(--accent-3); text-align: center;
    animation: fadein .25s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } }

  .afterRow { display: flex; gap: 10px; }
  .afterRow button { flex: 1; }

  footer.note { margin-top: 20px; font-size: .74rem; color: var(--ink-dim); text-align: center; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand"><span class="mark">&gt;_</span><h1 id="hudTitle">Advanced Lab</h1></div>
    <span class="stat streak" title="連続学習日数">🔥<b id="streakNum">0</b></span>
    <span class="stat xp" title="経験値">XP<b id="xpNum">0</b></span>
    <button class="iconbtn" id="themeBtn" aria-label="テーマ切替" title="テーマ切替">🌓</button>
    <button class="iconbtn" id="soundBtn" aria-label="音のオン/オフ" title="音のオン/オフ">🔔</button>
  </header>

  <section id="screens">
    <!-- ===== 科目選択 ===== -->
    <section id="home">
      <p class="lead">科目を選んでください。電磁気学は乱数生成、東大数学は厳選バンク方式です。どちらも途中式を省略せずに解説します。</p>
      <div class="subjectGrid">
        <button class="subjectCard em" data-subject="em">
          <span class="tag">Physics</span>
          <span class="ttl">電磁気学</span>
          <span class="desc">クーロンの法則・オームの法則・コンデンサなど。パラメータは毎回ランダム生成、答えは同じ式から自動計算します。</span>
        </button>
        <button class="subjectCard math" data-subject="math">
          <span class="tag">Mathematics</span>
          <span class="ttl">東大入試レベル数学</span>
          <span class="desc">微積分・確率・数列などの厳選問題。丁寧な途中式つきの解答を用意しています。</span>
        </button>
      </div>
    </section>

    <!-- ===== 単元選択 ===== -->
    <section id="units" hidden>
      <div class="backRow">
        <button class="backBtn" data-back="home">← 科目選択</button>
      </div>
      <p class="screenTitle" id="unitsTitle">単元を選択</p>
      <div class="unitList" id="unitList"></div>
    </section>

    <!-- ===== 出題画面 ===== -->
    <section id="quiz" hidden>
      <div class="backRow">
        <button class="backBtn" data-back="units">← 単元選択</button>
        <span class="breadcrumb" id="quizBreadcrumb"></span>
      </div>
      <div class="panel">
        <div class="qnoRow">
          <span class="qtag" id="qTag"></span>
          <span class="qcounter" id="qCounter"></span>
        </div>
        <p class="qbody" id="qBody"></p>
        <p class="given" id="qGiven" hidden></p>
        <div class="answerRow">
          <input id="qInput" type="text" inputmode="decimal" autocomplete="off" placeholder="答えを入力" />
          <span class="unitSuffix" id="qUnitSuffix"></span>
        </div>
        <p class="hint" id="qHint" hidden></p>
        <div class="answerRow" style="margin-top:10px;">
          <button class="primaryBtn wide" id="submitBtn">解答する</button>
        </div>
      </div>
    </section>

    <!-- ===== 解答（解説）画面 ===== -->
    <section id="solution" hidden>
      <div class="backRow">
        <span class="breadcrumb" id="solBreadcrumb"></span>
      </div>
      <div class="panel">
        <div class="verdict" id="verdictBox">
          <span class="big" id="verdictIcon"></span>
          <span id="verdictText"></span>
        </div>
        <p class="answerLine" id="answerLine" style="margin-top:14px;"></p>
        <div class="diagramBox" id="diagramBox" hidden></div>
        <div class="whyBox" id="whyBox" hidden></div>
        <div class="divider"></div>
        <div class="steps" id="stepsBox"></div>
        <div class="altBox" id="altBox" hidden>
          <span class="lbl">別解</span>
          <div class="steps" id="altStepsBox"></div>
        </div>
      </div>

      <!-- ===== 自己採点 ===== -->
      <div class="panel selfGrade" id="selfGradePanel">
        <p class="prompt">自分の解答をふりかえって、正直に記録してください（間隔反復の材料になります）。</p>
        <div class="selfGradeBtns">
          <button class="gradeBtn good" id="gradeGood"><span class="e">◎</span>できた</button>
          <button class="gradeBtn bad" id="gradeBad"><span class="e">✕</span>できなかった</button>
        </div>
        <p class="xpToast" id="xpToast" hidden></p>
      </div>

      <div class="afterRow">
        <button class="ghostBtn" id="nextInUnitBtn">この単元をもう一問</button>
        <button class="primaryBtn" id="toUnitsBtn">単元選択へ</button>
      </div>
    </section>
  </section>

  <footer class="note">数式表示: KaTeX 0.18.9（CDN）。誤り・改善提案は歓迎します。学習記録はこの端末のブラウザにのみ保存されます。</footer>
</div>

<script>
// ============================================================
//  Advanced Lab — 電磁気学・東大数学 学習アプリ（単一HTMLファイル）
// ============================================================

// ---------- 便利関数（まなびっこと同じパターン） ----------
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const randf = (a, b, step = 1) => { const n = Math.round((a + Math.random() * (b - a)) / step) * step; return n; };
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 数値を「見やすい有効数字」に整形（末尾ゼロを削る）
function fmt(n, digits = 4) {
  if (!Number.isFinite(n)) return String(n);
  if (Math.abs(n) >= 1e6 || (Math.abs(n) < 1e-4 && n !== 0)) return n.toExponential(2);
  const r = Number(n.toPrecision(digits));
  return String(r);
}

// ---------- 保存（使えない環境でも止まらないよう try/catch） ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

const todayStr = () => new Date().toISOString().slice(0, 10);

const state = {
  theme: store.get("adv.theme", null),      // null=システム設定に従う, "light" / "dark"
  sound: store.get("adv.sound", true),
  xp: store.get("adv.xp", 0),
  streak: store.get("adv.streak", 0),
  lastStudyDay: store.get("adv.lastStudyDay", null),
  // 正誤履歴: { problemId, correct, timestamp } の配列。
  // 将来の間隔反復（SM-2風）ロジックがこの形をそのまま使える設計にしている。
  history: store.get("adv.history", []),
};
if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);

function saveState() {
  store.set("adv.xp", state.xp);
  store.set("adv.streak", state.streak);
  store.set("adv.lastStudyDay", state.lastStudyDay);
  store.set("adv.history", state.history);
}

function bumpStreakIfNewDay() {
  const today = todayStr();
  if (state.lastStudyDay === today) return;
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  state.streak = state.lastStudyDay === y ? state.streak + 1 : 1;
  state.lastStudyDay = today;
  saveState();
}

function addXp(n) {
  state.xp += n;
  saveState();
  renderHud();
}

// 正誤履歴を1件追加する（間隔反復の後続タスクがそのまま参照できる形）
function recordAttempt(problemId, correct) {
  state.history.push({ problemId, correct, timestamp: Date.now() });
  // 履歴が無限に増え続けないよう直近2000件に制限
  if (state.history.length > 2000) state.history = state.history.slice(-2000);
  saveState();
}

function renderHud() {
  $("xpNum").textContent = state.xp;
  $("streakNum").textContent = state.streak;
}

// ---------- 音（Web Audio API のオシレーター合成。まなびっこと同じパターンだが控えめに） ----------
let audio = null;
function tone(freq, start, dur, type = "sine", vol = 0.1) {
  if (!state.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime + start, o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  } catch {}
}
const sfx = {
  correct() { tone(660, 0, 0.09, "sine", 0.09); tone(880, 0.08, 0.16, "sine", 0.09); },
  wrong() { tone(220, 0, 0.16, "sine", 0.1); tone(180, 0.12, 0.22, "sine", 0.1); },
  tap() { tone(500, 0, 0.04, "sine", 0.05); },
};

// ---------- 読み上げは学習アプリとしては不要のため実装しない（まなびっこと異なる方針） ----------

// ============================================================
//  KaTeX レンダリング（CDN失敗時はプレーンテキストにフォールバック）
// ============================================================
function renderMath(container) {
  if (!container) return;
  try {
    if (window.renderMathInElement) {
      window.renderMathInElement(container, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
        ],
        throwOnError: false,
      });
    }
    // renderMathInElement 自体が無い（CDN読み込み失敗）場合は何もしない
    // → "$...$" 付きのプレーンテキストがそのまま表示され、アプリは壊れずに使える
  } catch (e) {
    console.warn("KaTeX render failed, falling back to plain text:", e);
  }
}

// ============================================================
//  用語の一言定義（初出時にそっと添える）
// ============================================================
function term(word, def) {
  return `<span class="term">${word}<span class="def">（${def}）</span></span>`;
}

// ============================================================
//  図解：軽量インラインSVGビルダー（テーマのCSSトークンを継承するので
//  ライト/ダーク両方で自然に見える。外部画像は使わない）
// ============================================================
function svgWrap(inner, viewBox, label) {
  return `<svg viewBox="${viewBox}" role="img" aria-label="${label || ""}">${inner}</svg>`;
}

function resistorSymbol(cx, cy, w = 44, h = 14, rot = 0) {
  const n = 6, seg = w / n;
  const pts = [[cx - w / 2, cy]];
  for (let i = 1; i < n; i++) pts.push([cx - w / 2 + seg * i, cy + (i % 2 === 0 ? h / 2 : -h / 2)]);
  pts.push([cx + w / 2, cy]);
  const d = "M " + pts.map((p) => p.join(",")).join(" L ");
  const g = rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : "";
  return `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"${g}/>`;
}

function capacitorSymbol(cx, cy, rot = 0) {
  const g = rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : "";
  return `<g${g} stroke="var(--accent-2)" stroke-width="2.5">
    <line x1="${cx - 8}" y1="${cy - 10}" x2="${cx - 8}" y2="${cy + 10}"/>
    <line x1="${cx + 8}" y1="${cy - 10}" x2="${cx + 8}" y2="${cy + 10}"/>
  </g>`;
}

// 微積分：実際の関数・区間からグラフと面積の塗りを計算して描く
function svgAreaUnderCurve(f, a, b) {
  const padX = (b - a) * 0.15;
  const xMin = a - padX, xMax = b + padX;
  const N = 60;
  const pts = [];
  let ymin = Infinity, ymax = -Infinity;
  for (let i = 0; i <= N; i++) {
    const x = xMin + (xMax - xMin) * i / N;
    const y = f(x);
    pts.push([x, y]);
    if (y < ymin) ymin = y;
    if (y > ymax) ymax = y;
  }
  ymin = Math.min(ymin, 0); ymax = Math.max(ymax, 0);
  const W = 260, H = 150, padL = 18, padR = 12, padT = 16, padB = 16;
  const sx = (x) => padL + (x - xMin) / (xMax - xMin) * (W - padL - padR);
  const sy = (y) => H - padB - (y - ymin) / (ymax - ymin) * (H - padT - padB);
  const curve = pts.map(([x, y], i) => `${i === 0 ? "M" : "L"} ${sx(x).toFixed(1)} ${sy(y).toFixed(1)}`).join(" ");
  const shadePts = pts.filter(([x]) => x >= a - 1e-9 && x <= b + 1e-9);
  const shadePath = `M ${sx(a).toFixed(1)} ${sy(0).toFixed(1)} ` +
    shadePts.map(([x, y]) => `L ${sx(x).toFixed(1)} ${sy(y).toFixed(1)}`).join(" ") +
    ` L ${sx(b).toFixed(1)} ${sy(0).toFixed(1)} Z`;
  const axisY = sy(0);
  return svgWrap(`
    <line x1="${padL}" y1="${axisY.toFixed(1)}" x2="${W - padR}" y2="${axisY.toFixed(1)}" stroke="var(--ink-dim)" stroke-width="1"/>
    <path d="${shadePath}" fill="var(--accent-2)" fill-opacity="0.3" stroke="none"/>
    <path d="${curve}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${sx(a).toFixed(1)}" y="${(axisY + 14).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">${a}</text>
    <text x="${sx(b).toFixed(1)}" y="${(axisY + 14).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">${b}</text>
  `, `0 0 ${W} ${H}`, "面積のグラフ");
}

// 確率：6x6の格子で「条件付き確率」を視覚化（濃淡＝事象A・A∩B）
function svgDiceGrid() {
  const cell = 22, ox = 34, oy = 12;
  let cells = "";
  for (let a1 = 1; a1 <= 6; a1++) {
    for (let b1 = 1; b1 <= 6; b1++) {
      const x = ox + (b1 - 1) * cell, y = oy + (a1 - 1) * cell;
      const inA = a1 + b1 === 8;
      const inAB = inA && (a1 === 2 || b1 === 2);
      const fill = inAB ? "var(--accent)" : inA ? "color-mix(in srgb, var(--accent) 35%, var(--panel-2))" : "var(--panel-2)";
      cells += `<rect x="${x}" y="${y}" width="${cell - 2}" height="${cell - 2}" rx="3" fill="${fill}" stroke="var(--line)" stroke-width="0.5"/>`;
    }
  }
  let labels = "";
  for (let i = 1; i <= 6; i++) {
    labels += `<text x="${ox - 12}" y="${oy + (i - 1) * cell + 14}" font-size="9" fill="var(--ink-dim)" text-anchor="middle">${i}</text>`;
    labels += `<text x="${ox + (i - 1) * cell + 10}" y="${oy - 4}" font-size="9" fill="var(--ink-dim)" text-anchor="middle">${i}</text>`;
  }
  return svgWrap(`
    ${cells}${labels}
    <text x="${ox + 3 * cell}" y="${oy + 6 * cell + 16}" text-anchor="middle" font-size="8.5" fill="var(--ink-dim)">濃＝和が8(A・5通り)</text>
    <text x="${ox + 3 * cell}" y="${oy + 6 * cell + 28}" text-anchor="middle" font-size="8.5" fill="var(--ink-dim)">最濃＝Aかつ2を含む(2通り)</text>
  `, "0 0 200 190", "条件付き確率の格子図");
}

// 数列：最初の数項を棒グラフで
function svgSequenceBars(terms) {
  const W = 220, H = 120, padL = 24, padB = 20, padT = 14;
  const maxV = Math.max(...terms);
  const bw = (W - padL - 10) / terms.length;
  const bars = terms.map((v, i) => {
    const h = (v / maxV) * (H - padT - padB);
    const x = padL + i * bw + 4, y = H - padB - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 8).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent-3)"/>
      <text x="${(x + (bw - 8) / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">${v}</text>
      <text x="${(x + (bw - 8) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--ink-dim)">a${i + 1}</text>`;
  }).join("");
  return svgWrap(`
    <line x1="${padL}" y1="${H - padB}" x2="${W - 6}" y2="${H - padB}" stroke="var(--ink-dim)" stroke-width="1"/>
    ${bars}
  `, `0 0 ${W} ${H}`, "数列の項の棒グラフ");
}

// ============================================================
//  電磁気学：ジェネレーター方式
//  各トピックは { param生成 → 同じ式から出題文・答え・途中式を作る } 関数を持つ。
//  「出題に使う式」と「採点に使う式」が絶対にズレないよう、
//  answer は必ずこの関数内の同じ変数から計算する。
// ============================================================
const K_COULOMB = 8.99e9; // クーロン定数 [N·m^2/C^2]（有効数字3桁で表示に使う）

const EM_TOPICS = {
  coulomb: {
    name: "クーロンの法則",
    meta: "静電気力 / 高校物理",
    unitLabel: "N",
    gen() {
      // q1, q2 は µC 単位の乱数、r は cm 単位の乱数（扱いやすい桁にする）
      const q1uC = rand(1, 9), q2uC = rand(1, 9);
      const rCm = rand(10, 60);
      const q1 = q1uC * 1e-6, q2 = q2uC * 1e-6, r = rCm / 100; // SI単位に変換
      const F = (K_COULOMB * q1 * q2) / (r * r); // ← 出題にも採点にもこの式を使う
      return {
        vars: { q1uC, q2uC, rCm, q1, q2, r, F },
        prompt: `真空中に、電荷 $q_1 = ${q1uC}\\,\\mu\\text{C}$ と $q_2 = ${q2uC}\\,\\mu\\text{C}$ の点電荷が、` +
          `距離 $r = ${rCm}\\,\\text{cm}$ だけ離れて置かれている。両者の間にはたらくクーロン力の大きさ $F$ を求めよ。`,
        given: `クーロン定数 $k = 8.99\\times10^{9}\\,\\text{N·m}^2/\\text{C}^2$ とする。`,
        answer: F,
        unitLabel: "N",
        digits: 3,
        why: `クーロン力が距離の2乗に反比例するのは、点電荷から出る${term("電場", "電荷の周りの空間にできる、他の電荷に力を及ぼすはたらき")}の管（電場線）が球面状に広がるため。半径 $r$ の球の表面積は $4\\pi r^2$ なので、同じ本数の管がより広い面積に広がるほど密度（＝場の強さ）は $1/r^2$ で薄くなる。`,
        steps: [
          `クーロンの法則は $F = k\\dfrac{|q_1 q_2|}{r^2}$ である。`,
          `単位をSI単位に直す：$q_1 = ${q1uC}\\,\\mu\\text{C} = ${q1.toExponential(2)}\\,\\text{C}$、` +
            `$q_2 = ${q2uC}\\,\\mu\\text{C} = ${q2.toExponential(2)}\\,\\text{C}$、$r = ${rCm}\\,\\text{cm} = ${r}\\,\\text{m}$。`,
          `代入すると $F = 8.99\\times10^{9} \\times \\dfrac{${q1.toExponential(2)} \\times ${q2.toExponential(2)}}{(${r})^2}$`,
          `$F = 8.99\\times10^{9} \\times \\dfrac{${(q1 * q2).toExponential(3)}}{${(r * r).toExponential(3)}}$`,
          `よって $F \\approx ${fmt(F, 3)}\\,\\text{N}$。`,
        ],
        altSteps: [
          `別解（電場を経由して求める）：まず $q_1$ が距離 $r$ の位置につくる電場の大きさ $E_1 = k\\dfrac{|q_1|}{r^2}$ を求める。`,
          `代入すると $E_1 = 8.99\\times10^{9} \\times \\dfrac{${q1.toExponential(2)}}{${(r * r).toExponential(3)}} \\approx ${fmt((K_COULOMB * q1) / (r * r), 3)}\\,\\text{N/C}$。`,
          `電場の中に置かれた電荷 $q_2$ が受ける力は $F = q_2 E_1$ なので、$F \\approx ${q2.toExponential(2)} \\times ${fmt((K_COULOMB * q1) / (r * r), 3)} \\approx ${fmt(F, 3)}\\,\\text{N}$ となり、直接計算と一致する。`,
        ],
        diagram: svgCoulomb("q₁", "q₂").replace("同符号なら反発。離れるほど力は弱まる", `q₁=${q1uC}µC, q₂=${q2uC}µC, r=${rCm}cm`),
      };
    },
  },
  ohm: {
    name: "オームの法則・直列/並列合成抵抗",
    meta: "回路 / 高校物理",
    unitLabel: "A",
    gen() {
      const V = rand(6, 24);              // 電源電圧 [V]
      const R1 = rand(2, 20), R2 = rand(2, 20); // 抵抗 [Ω]
      const series = Math.random() < 0.5;
      const Rtotal = series ? R1 + R2 : (R1 * R2) / (R1 + R2); // ← 出題・採点共通の式
      const I = V / Rtotal; // ← 全体を流れる電流（回路の主答）
      const connectLabel = series ? "直列" : "並列";
      const combineFormula = series
        ? `R_{12} = R_1 + R_2`
        : `\\dfrac{1}{R_{12}} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}`;

          : `並列接続では $R_1$、$R_2$ の両端に同じ電圧 $V$ がかかり、流れる電流はそれぞれ $I_1=\\dfrac{V}{R_1}$、$I_2=\\dfrac{V}{R_2}$。全体の電流はその和 $I=V\\left(\\dfrac{1}{R_1}+\\dfrac{1}{R_2}\\right)$ になるので、抵抗の逆数（${term("コンダクタンス", "抵抗の逆数。値が大きいほど電流が流れやすいことを表す量")}）どうしが単純な和になる。`,
        steps: [
          `まず合成抵抗 $R_{12}$ を求める。${connectLabel}接続なので $${combineFormula}$ が成り立つ。`,

            ? `代入すると $R_{12} = ${R1} + ${R2} = ${Rtotal}\\,\\Omega$。`
            : `代入すると $\\dfrac{1}{R_{12}} = \\dfrac{1}{${R1}} + \\dfrac{1}{${R2}} = \\dfrac{${R1}+${R2}}{${R1}\\times${R2}}$、` +

          `オームの法則 $V = IR_{12}$ より $I = \\dfrac{V}{R_{12}}$。`,
          `代入すると $I = \\dfrac{${V}}{${fmt(Rtotal, 4)}}$`,

        ],
        altSteps: series
          ? [
              `別解（各抵抗の電圧降下を確かめる）：電流 $I \\approx ${fmt(I, 3)}\\,\\text{A}$ が両方の抵抗を流れるので、$V_1=IR_1 \\approx ${fmt(I * R1, 3)}\\,\\text{V}$、$V_2=IR_2 \\approx ${fmt(I * R2, 3)}\\,\\text{V}$。`,
              `キルヒホッフの電圧法則より $V_1+V_2 \\approx ${fmt(I * R1 + I * R2, 3)}\\,\\text{V}$ となり、電源電圧 $V=${V}\\,\\text{V}$ と一致する（検算）。`,
            ]
          : [
              `別解（コンダクタンスで求める）：$G_1=\\dfrac{1}{R_1}=${fmt(1 / R1, 4)}\\,\\text{S}$、$G_2=\\dfrac{1}{R_2}=${fmt(1 / R2, 4)}\\,\\text{S}$。`,
              `並列では電流の通り道が増えるだけなので、コンダクタンスは単純に加算できる：$G_{12}=G_1+G_2 \\approx ${fmt(1 / R1 + 1 / R2, 4)}\\,\\text{S}$。`,
              `よって $R_{12}=\\dfrac{1}{G_{12}} \\approx ${fmt(1 / (1 / R1 + 1 / R2), 4)}\\,\\Omega$（本解と一致）、$I=\\dfrac{V}{R_{12}} \\approx ${fmt(I, 3)}\\,\\text{A}$。`,
            ],
        diagram: svgCircuit(series, "R₁", "R₂"),
      };
    },
  },
  capacitor: {
    name: "コンデンサの合成容量",
    meta: "静電容量 / 高校物理",
    unitLabel: "µF",
    gen() {
      const C1 = rand(2, 20), C2 = rand(2, 20); // µF
      const series = Math.random() < 0.5;
      const Ctotal = series ? (C1 * C2) / (C1 + C2) : C1 + C2; // ← コンデンサは抵抗と逆
      const connectLabel = series ? "直列" : "並列";
      const combineFormula = series
        ? `\\dfrac{1}{C_{12}} = \\dfrac{1}{C_1} + \\dfrac{1}{C_2}`
        : `C_{12} = C_1 + C_2`;
      return {
        vars: { C1, C2, Ctotal, series },
        prompt: `静電容量 $C_1 = ${C1}\\,\\mu\\text{F}$ と $C_2 = ${C2}\\,\\mu\\text{F}$ のコンデンサを` +
          `${connectLabel}に接続した。合成容量 $C_{12}$ を求めよ。`,
        given: `コンデンサの初期電荷は $0$ とする。`,
        answer: Ctotal,
        unitLabel: "µF",
        digits: 4,
        why: series
          ? `直列に並んだコンデンサでは、間の導体が孤立しているため${term("電荷", "物体が帯びている電気の量")}保存則により両方のコンデンサに同じ電荷 $Q$ が蓄えられる。電圧の和は $V=V_1+V_2=\\dfrac{Q}{C_1}+\\dfrac{Q}{C_2}$ となるので、抵抗の並列と同じ形の式になる（抵抗とは直列・並列が入れ替わる点に注意）。`
          : `並列に並んだコンデンサは両方とも同じ電圧 $V$ を共有する。蓄えられる電荷はそれぞれ $Q_1=C_1V$、$Q_2=C_2V$ で、全体の電荷は $Q_1+Q_2=(C_1+C_2)V$ となるので、${term("静電容量", "コンデンサが電圧1Vあたりに蓄えられる電荷の量")}は単純に足し算になる。`,
        steps: [
          `${connectLabel}接続の合成容量は $${combineFormula}$ で与えられる` +
            `（コンデンサは抵抗と直列・並列の式が入れ替わることに注意）。`,
          series
            ? `代入すると $\\dfrac{1}{C_{12}} = \\dfrac{1}{${C1}} + \\dfrac{1}{${C2}} = \\dfrac{${C1}+${C2}}{${C1}\\times${C2}}$、` +
              `よって $C_{12} = \\dfrac{${C1}\\times${C2}}{${C1}+${C2}} = ${fmt(Ctotal, 4)}\\,\\mu\\text{F}$。`
            : `代入すると $C_{12} = ${C1} + ${C2} = ${Ctotal}\\,\\mu\\text{F}$。`,
          `よって合成容量は $C_{12} \\approx ${fmt(Ctotal, 4)}\\,\\mu\\text{F}$。`,
        ],
        altSteps: series
          ? [
              `別解（電荷 $Q=1\\,\\mu\\text{C}$ と仮定して確かめる）：直列では両方に同じ電荷が乗るので、$Q=1\\,\\mu\\text{C}$ とすると $V_1=\\dfrac{Q}{C_1}=\\dfrac{1}{${C1}}\\,\\text{V}$、$V_2=\\dfrac{Q}{C_2}=\\dfrac{1}{${C2}}\\,\\text{V}$。`,
              `合計電圧は $V=V_1+V_2 \\approx ${fmt(1 / C1 + 1 / C2, 4)}\\,\\text{V}$。`,
              `合成容量は $C_{12}=\\dfrac{Q}{V} \\approx ${fmt(1 / (1 / C1 + 1 / C2), 4)}\\,\\mu\\text{F}$（本解と一致。$Q$の値には依らない）。`,
            ]
          : [
              `別解（電圧 $V=1\\,\\text{V}$ と仮定して確かめる）：並列では両方に同じ電圧がかかるので、$V=1\\,\\text{V}$ とすると $Q_1=C_1V=${C1}\\,\\mu\\text{C}$、$Q_2=C_2V=${C2}\\,\\mu\\text{C}$。`,
              `全体の電荷は $Q=Q_1+Q_2=${C1 + C2}\\,\\mu\\text{C}$。`,
              `合成容量は $C_{12}=\\dfrac{Q}{V}=${C1 + C2}\\,\\mu\\text{F}$（本解と一致。$V$の値には依らない）。`,
            ],
        diagram: svgCapacitorCircuit(series, "C₁", "C₂"),
      };
    },
  },
};

// ============================================================
//  科目・単元データ（画面遷移用の統一インターフェース）
// ============================================================
const SUBJECTS = {
  em: { name: "電磁気学", kind: "generator", topics: EM_TOPICS },
  math: { name: "東大入試レベル数学", kind: "bank", bank: MATH_BANK },
};

// 現在の学習セッションの状態
let session = {
  subject: null,     // "em" | "math"
  topicKey: null,     // em: EM_TOPICSのキー / math: 単元名でグルーピングして使う
  problem: null,       // 現在の問題データ（gen()の返り値、またはbankの1件）
  problemId: null,     // 履歴記録用のID
  submitted: null,      // ユーザーの入力値（文字列）
  correct: null,         // 自己採点前の自動判定（正誤の目安として表示にも使う）
};

// ============================================================
//  画面切り替え（まなびっこの show() と同じパターン）
// ============================================================
function show(id) {
  ["home", "units", "quiz", "solution"].forEach((s) => ($(s).hidden = s !== id));
  scrollTo(0, 0);
}

// ============================================================
//  単元選択画面
// ============================================================
function unitStatsFor(problemIdPrefix) {
  const rows = state.history.filter((h) => h.problemId.startsWith(problemIdPrefix));
  if (!rows.length) return null;
  const correct = rows.filter((r) => r.correct).length;
  return { total: rows.length, correct };
}

function openUnits(subjectKey) {
  session.subject = subjectKey;
  const subj = SUBJECTS[subjectKey];
  $("unitsTitle").textContent = subj.name + " — 単元選択";
  const list = $("unitList");
  list.innerHTML = "";

  if (subj.kind === "generator") {
    Object.entries(subj.topics).forEach(([key, topic], i) => {
      const st = unitStatsFor(`em:${key}:`);
      const badge = st ? `${st.correct}/${st.total} できた` : "未挑戦";
      const row = document.createElement("button");
      row.className = "unitRow";
      row.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span>
        <span class="body"><span class="name">${topic.name}</span><span class="meta">${topic.meta}</span></span>
        <span class="stat-badge${st ? " hasdata" : ""}">${badge}</span>`;
      row.addEventListener("click", () => startGeneratorProblem(key));
      list.appendChild(row);
    });
  } else {
    // 数学バンクは単元タグでグルーピングして表示
    const units = [...new Set(subj.bank.map((p) => p.unit))];
    units.forEach((unitName, i) => {
      const problems = subj.bank.filter((p) => p.unit === unitName);
      const st = unitStatsFor(`math:${unitName}:`);
      const badge = st ? `${st.correct}/${st.total} できた` : `全${problems.length}問`;
      const row = document.createElement("button");
      row.className = "unitRow";
      row.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span>
        <span class="body"><span class="name">${unitName}</span><span class="meta">${problems[0].meta}</span></span>
        <span class="stat-badge${st ? " hasdata" : ""}">${badge}</span>`;
      row.addEventListener("click", () => startBankProblem(unitName));
      list.appendChild(row);
    });
  }
  show("units");
}

// ============================================================
//  出題（電磁気学：ジェネレーター）
// ============================================================
function startGeneratorProblem(topicKey) {
  const topic = EM_TOPICS[topicKey];
  const problem = topic.gen(); // ← 出題も採点もこの1回の呼び出しの結果だけを使う
  session.topicKey = topicKey;
  session.problem = problem;
  session.problemId = `em:${topicKey}:${Date.now()}`;
  session.submitted = null;
  session.correct = null;

  $("quizBreadcrumb").textContent = `電磁気学 / ${topic.name}`;
  $("qTag").textContent = topic.name;
  $("qCounter").textContent = "ランダム生成";
  $("qBody").textContent = ""; // 直接innerHTMLへ（KaTeXデリミタを含むため）
  $("qBody").innerHTML = problem.prompt;
  if (problem.given) { $("qGiven").hidden = false; $("qGiven").innerHTML = problem.given; }
  else { $("qGiven").hidden = true; }
  $("qUnitSuffix").textContent = problem.unitLabel || "";
  $("qInput").value = "";
  $("qHint").hidden = true;
  renderMath($("qBody"));
  renderMath($("qGiven"));
  show("quiz");
  $("qInput").focus();
}

// ============================================================
//  出題（数学：バンク）
// ============================================================
function startBankProblem(unitName) {
  const candidates = MATH_BANK.filter((p) => p.unit === unitName);
  const problem = pick(candidates);
  session.topicKey = unitName;
  session.problem = problem;
  session.problemId = `math:${unitName}:${problem.id}`;
  session.submitted = null;
  session.correct = null;

  $("quizBreadcrumb").textContent = `東大数学 / ${unitName}`;
  $("qTag").textContent = problem.unit + "（" + problem.meta + "）";
  $("qCounter").textContent = "厳選バンク";
  $("qBody").innerHTML = problem.prompt;
  if (problem.given) { $("qGiven").hidden = false; $("qGiven").innerHTML = problem.given; }
  else { $("qGiven").hidden = true; }
  $("qUnitSuffix").textContent = problem.unitLabel || "";
  $("qInput").value = "";
  $("qHint").hidden = true;
  renderMath($("qBody"));
  renderMath($("qGiven"));
  show("quiz");
  $("qInput").focus();
}

// ============================================================
//  解答判定・解説画面
// ============================================================
function judgeAnswer() {
  const raw = $("qInput").value.trim().replace(/,/g, "");
  const val = parseFloat(raw);
  const problem = session.problem;
  const target = problem.answer !== undefined ? problem.answer : problem.answerValue;
  const tolerance = problem.tolerance !== undefined ? problem.tolerance : Math.max(Math.abs(target) * 0.01, 1e-3);
  const ok = raw !== "" && Number.isFinite(val) && Math.abs(val - target) <= tolerance;
  session.submitted = raw;
  session.correct = ok;
  return ok;
}

function renderSolution() {
  const problem = session.problem;
  const ok = session.correct;

  $("solBreadcrumb").textContent = $("quizBreadcrumb").textContent;

  const verdict = $("verdictBox");
  verdict.className = "verdict " + (ok ? "correct" : "wrong");
  $("verdictIcon").textContent = ok ? "◎" : "✕";
  $("verdictText").textContent = ok
    ? `正解！ あなたの解答: ${session.submitted}`
    : `不正解。あなたの解答: ${session.submitted || "（未回答）"}`;

  const answerDisplay = problem.answerDisplay !== undefined
    ? problem.answerDisplay
    : `${fmt(problem.answer, problem.digits || 4)}${problem.unitLabel ? "\\,\\text{" + problem.unitLabel + "}" : ""}`;
  $("answerLine").innerHTML = `正解: $${answerDisplay}$`;

  const stepsBox = $("stepsBox");
  stepsBox.innerHTML = "";
  problem.steps.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "step";
    row.innerHTML = `<span class="n">${i + 1}</span><span class="txt">${s}</span>`;
    stepsBox.appendChild(row);
  });

  // ===== 図解（SVG） =====
  const diagramBox = $("diagramBox");
  if (problem.diagram) { diagramBox.hidden = false; diagramBox.innerHTML = problem.diagram; }
  else { diagramBox.hidden = true; diagramBox.innerHTML = ""; }

  // ===== 公式の根拠（なぜ成り立つか） =====
  const whyBox = $("whyBox");
  if (problem.why) { whyBox.hidden = false; whyBox.innerHTML = `<span class="lbl">なぜ成り立つか</span>${problem.why}`; }
  else { whyBox.hidden = true; whyBox.innerHTML = ""; }

  // ===== 別解 =====
  const altBox = $("altBox");
  const altStepsBox = $("altStepsBox");
  if (problem.altSteps && problem.altSteps.length) {
    altBox.hidden = false;
    altStepsBox.innerHTML = "";
    problem.altSteps.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "step";
      row.innerHTML = `<span class="n">${i + 1}</span><span class="txt">${s}</span>`;
      altStepsBox.appendChild(row);
    });
  } else {
    altBox.hidden = true;
    altStepsBox.innerHTML = "";
  }

  renderMath($("answerLine"));
  renderMath($("whyBox"));
  renderMath(stepsBox);
  renderMath(altStepsBox);

  $("xpToast").hidden = true;
  $("gradeGood").disabled = false;
  $("gradeBad").disabled = false;

  if (ok) sfx.correct(); else sfx.wrong();
  show("solution");
}

// ============================================================
//  自己採点（できた／できなかった）→ XP・ストリーク・履歴
// ============================================================
function selfGrade(good) {
  $("gradeGood").disabled = true;
  $("gradeBad").disabled = true;
  recordAttempt(session.problemId, good);
  bumpStreakIfNewDay();
  if (good) {
    addXp(10);
    $("xpToast").hidden = false;
    $("xpToast").textContent = "+10 XP を獲得しました";
  } else {
    addXp(2); // 取り組んだこと自体にも少しXPを与える（Duolingo的な「積み上げ」重視）
    $("xpToast").hidden = false;
    $("xpToast").textContent = "+2 XP（この問題はまた出題されます）";
  }
}

// ============================================================
//  イベント結線
// ============================================================
document.querySelectorAll(".subjectCard").forEach((btn) => {
  btn.addEventListener("click", () => { sfx.tap(); openUnits(btn.dataset.subject); });
});
document.querySelectorAll("[data-back]").forEach((btn) => {
  btn.addEventListener("click", () => { sfx.tap(); show(btn.dataset.back); });
});
$("submitBtn").addEventListener("click", () => {
  judgeAnswer();
  renderSolution();
});
$("qInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); judgeAnswer(); renderSolution(); }
});
$("gradeGood").addEventListener("click", () => selfGrade(true));
$("gradeBad").addEventListener("click", () => selfGrade(false));
$("nextInUnitBtn").addEventListener("click", () => {
  sfx.tap();
  if (session.subject === "em") startGeneratorProblem(session.topicKey);
  else startBankProblem(session.topicKey);
});
$("toUnitsBtn").addEventListener("click", () => { sfx.tap(); openUnits(session.subject); });

$("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const effectiveCur = cur || (sysDark ? "dark" : "light");
  const next = effectiveCur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  state.theme = next;
  store.set("adv.theme", next);
});
$("soundBtn").addEventListener("click", () => {
  state.sound = !state.sound;
  store.set("adv.sound", state.sound);
  $("soundBtn").textContent = state.sound ? "🔔" : "🔕";
  if (state.sound) sfx.tap();
});
if (!state.sound) $("soundBtn").textContent = "🔕";

// ---------- 起動時の初期表示 ----------
renderHud();
show("home");
</script>
</body>
</html>
