name: textbook-scan tests

on:
  push:
    branches: ["**"]
    paths:
      - "textbook-scan/**"
      - ".github/workflows/textbook-scan-tests.yml"
  pull_request:
    paths:
      - "textbook-scan/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: textbook-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
